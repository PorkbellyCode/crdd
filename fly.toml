# fly.toml app configuration file generated for crdd on 2026-09-20T15:47:08+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'crdd'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  NEXT_TELEMETRY_DISABLED = '1'
  NODE_ENV = 'production'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 16
    soft_limit = 8

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
