# fly.toml app configuration file generated for crdd on 2026-09-20T15:47:08+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'crdd'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  NEXT_TELEMETRY_DISABLED = '1'
  NODE_ENV = 'production'
  # 로그인 콜백 주소의 기준. standalone 서버는 요청 주소를 0.0.0.0 등으로 보기 때문에
  # 명시하지 않으면 GitHub에 등록한 Redirect URI와 어긋난다
  AUTH_URL = 'https://crdd.fly.dev'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 16
    soft_limit = 8

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
